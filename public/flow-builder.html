<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Builder - CRM 2.0</title>

  <!-- Drawflow CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow/dist/drawflow.min.css">

  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      color: #333;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: white;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 2px solid #f0f0f0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .sidebar-header h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .sidebar-section {
      padding: 15px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .sidebar-section-title {
      padding: 10px 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #999;
      letter-spacing: 0.5px;
    }

    .node-button {
      margin: 8px 10px;
      padding: 12px 15px;
      background: #f5f5f5;
      border: 2px solid #ddd;
      border-radius: 6px;
      cursor: grab;
      user-select: none;
      transition: all 0.2s;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .node-button:hover {
      background: #667eea;
      color: white;
      border-color: #667eea;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .node-button i {
      width: 16px;
      text-align: center;
    }

    /* MAIN EDITOR */
    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .toolbar {
      padding: 15px 20px;
      background: white;
      border-bottom: 2px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .flow-name {
      flex: 1;
    }

    .flow-name input {
      width: 100%;
      padding: 10px 15px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .flow-name input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 8px rgba(102, 126, 234, 0.2);
    }

    .toolbar-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      border: 2px solid #ddd;
    }

    .btn-secondary:hover {
      background: #e9e9e9;
    }

    .btn-danger {
      background: #ff4757;
      color: white;
    }

    .btn-danger:hover {
      background: #ff3838;
    }

    /* DRAWFLOW EDITOR */
    #drawflow {
      flex: 1;
      background: linear-gradient(90deg, #f5f7fa 1px, transparent 1px),
                  linear-gradient(#f5f7fa 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: -1px -1px;
      background-color: #fafbfc;
      position: relative;
      overflow: hidden;
    }

    .drawflow {
      width: 100% !important;
      height: 100% !important;
    }

    /* NODE STYLES */
    .drawflow-node {
      background: white;
      border: 2px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      min-width: 200px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: all 0.2s;
    }

    .drawflow-node:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      border-color: #667eea;
    }

    .drawflow-node.selected {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    .node-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 13px;
      color: #667eea;
    }

    .node-header i {
      font-size: 14px;
    }

    .node-content {
      font-size: 12px;
      color: #555;
      line-height: 1.4;
      word-break: break-word;
    }

    .node-label {
      display: block;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #999;
      font-weight: 500;
    }

    .drawflow-node .input,
    .drawflow-node .output {
      height: 20px;
      width: 20px;
      background: white;
      border: 2px solid #667eea;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .drawflow-node .input {
      left: -10px;
    }

    .drawflow-node .output {
      right: -10px;
    }

    .drawflow-node .input:hover,
    .drawflow-node .output:hover {
      background: #667eea;
      box-shadow: 0 0 8px rgba(102, 126, 234, 0.5);
    }

    /* RIGHT PANEL */
    .properties-panel {
      width: 320px;
      background: white;
      border-left: 2px solid #f0f0f0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .properties-header {
      padding: 20px;
      border-bottom: 2px solid #f0f0f0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .properties-header h3 {
      font-size: 14px;
      font-weight: 600;
    }

    .property-group {
      padding: 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .property-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .property-group input,
    .property-group textarea,
    .property-group select {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .property-group input:focus,
    .property-group textarea:focus,
    .property-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 8px rgba(102, 126, 234, 0.2);
    }

    .property-group textarea {
      resize: vertical;
      min-height: 80px;
      font-family: 'Courier New', monospace;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .modal-header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
    }

    .modal-body {
      margin-bottom: 20px;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* STATUS MESSAGES */
    .status-message {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 15px 20px;
      border-radius: 6px;
      color: white;
      font-weight: 500;
      animation: slideIn 0.3s ease;
      z-index: 999;
    }

    .status-message.success {
      background: #2ed8b6;
    }

    .status-message.error {
      background: #ff4757;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* RESPONSIVE */
    @media (max-width: 1200px) {
      .sidebar {
        width: 240px;
      }
      .properties-panel {
        width: 280px;
      }
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: 200px;
        overflow-x: auto;
        flex-direction: row;
      }
      .properties-panel {
        width: 100%;
        height: 200px;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- SIDEBAR: Node Types -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2><i class="fas fa-cube"></i> Node Types</h2>
        <small>Drag and drop to canvas</small>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">📤 Input/Output</div>
        <button class="node-button" draggable="true" data-node="trigger">
          <i class="fas fa-play-circle"></i> Trigger
        </button>
        <button class="node-button" draggable="true" data-node="text">
          <i class="fas fa-comment"></i> Text
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">🎨 Messages</div>
        <button class="node-button" draggable="true" data-node="buttons">
          <i class="fas fa-square"></i> Buttons
        </button>
        <button class="node-button" draggable="true" data-node="card">
          <i class="fas fa-rectangle-landscape"></i> Card
        </button>
        <button class="node-button" draggable="true" data-node="carousel">
          <i class="fas fa-images"></i> Carousel
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">⚙️ Logic</div>
        <button class="node-button" draggable="true" data-node="condition">
          <i class="fas fa-code-branch"></i> Condition
        </button>
        <button class="node-button" draggable="true" data-node="input">
          <i class="fas fa-keyboard"></i> Input
        </button>
        <button class="node-button" draggable="true" data-node="delay">
          <i class="fas fa-hourglass"></i> Delay
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">🤖 Advanced</div>
        <button class="node-button" draggable="true" data-node="ai_agent">
          <i class="fas fa-robot"></i> AI Agent
        </button>
        <button class="node-button" draggable="true" data-node="action">
          <i class="fas fa-bolt"></i> Action
        </button>
        <button class="node-button" draggable="true" data-node="goto">
          <i class="fas fa-arrow-right"></i> GoTo
        </button>
      </div>
    </div>

    <!-- MAIN EDITOR -->
    <div class="editor-container">
      <div class="toolbar">
        <div class="flow-name">
          <input type="text" id="flowName" placeholder="Enter flow name...">
        </div>
        <div class="toolbar-actions">
          <button class="btn btn-secondary" id="btnClear">
            <i class="fas fa-trash"></i> Clear
          </button>
          <button class="btn btn-secondary" id="btnTest">
            <i class="fas fa-play"></i> Test
          </button>
          <button class="btn btn-primary" id="btnSave">
            <i class="fas fa-save"></i> Save
          </button>
        </div>
      </div>
      <div id="drawflow" class="drawflow"></div>
    </div>

    <!-- PROPERTIES PANEL -->
    <div class="properties-panel">
      <div class="properties-header">
        <h3><i class="fas fa-sliders-h"></i> Properties</h3>
      </div>
      <div id="propertiesContent" style="flex: 1; overflow-y: auto;">
        <div class="property-group">
          <p style="color: #999; font-size: 13px;">Select a node to edit properties</p>
        </div>
      </div>
    </div>
  </div>

  <!-- MODALS -->
  <div id="testModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">Test Flow</div>
      <div class="modal-body">
        <div class="property-group">
          <label>Sender ID</label>
          <input type="text" id="testSenderId" placeholder="123456789">
        </div>
        <div class="property-group">
          <label>Sender Name</label>
          <input type="text" id="testSenderName" placeholder="John Doe">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeTestModal()">Cancel</button>
        <button class="btn btn-primary" onclick="runTest()">Run Test</button>
      </div>
    </div>
  </div>

  <!-- Drawflow Script -->
  <script src="https://cdn.jsdelivr.net/npm/drawflow/dist/drawflow.min.js"></script>

  <!-- Flow Builder App -->
  <script src="/js/flow-builder.js"></script>
</body>
</html>
