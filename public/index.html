<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM 2.0 - Instagram Monitor</title>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #0f1115;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #8a2be2;
            --accent-hover: #9d4edd;
            --text-main: #f8f9fa;
            --text-muted: #adb5bd;
            --success: #20c997;
            --warning: #ffc107;
            --danger: #fa5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 15% 50%, rgba(138, 43, 226, 0.1), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(32, 201, 151, 0.05), transparent 25%);
        }

        header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 17, 21, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, #adb5bd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 99px;
            background: rgba(32, 201, 151, 0.1);
            color: var(--success);
            border: 1px solid rgba(32, 201, 151, 0.2);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(32, 201, 151, 0.7);
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(32, 201, 151, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(32, 201, 151, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(32, 201, 151, 0); }
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .logs-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .log-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            backdrop-filter: blur(8px);
            animation: slideIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .log-type {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
        }

        .type-dm { background: rgba(138, 43, 226, 0.15); color: #b175ff; }
        .type-comment { background: rgba(32, 201, 151, 0.15); color: var(--success); }
        .type-mention { background: rgba(255, 193, 7, 0.15); color: var(--warning); }
        .type-story { background: rgba(233, 30, 99, 0.15); color: #ff6699; }
        .type-error { background: rgba(250, 82, 82, 0.15); color: var(--danger); }
        .type-system { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }

        .log-content {
            font-size: 1rem;
            line-height: 1.5;
            word-break: break-word;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }

        .log-text {
            flex: 1;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
        }
        .header-left { display: flex; align-items: center; gap: 24px; }
        .nav-bar { display: flex; gap: 4px; }
        .nav-bar a {
            padding: 6px 14px;
            border-radius: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s;
        }
        .nav-bar a:hover { background: rgba(255,255,255,0.08); color: var(--text-main); }
        .nav-bar a.active { background: rgba(138, 43, 226, 0.15); color: #b175ff; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-connect {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #4f46e5, #8a2be2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
        }

        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(138, 43, 226, 0.4);
        }
        .btn-connect.connected {
            background: rgba(32, 201, 151, 0.1);
            color: var(--success);
            border: 1px solid rgba(32, 201, 151, 0.2);
            box-shadow: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h1>🤖 CRM 2.0 Monitor</h1>
            <nav class="nav-bar">
                <a href="/" class="active">Monitor</a>
                <a href="/automations.html">Automatizaciones</a>
                <a href="/welcome-ads.html">Welcome Ads</a>
                <a href="/builder.html">Builder</a>
                <a href="/ai-config.html">Configuración IA</a>
                <a href="/contacts.html">Contactos</a>
                <a href="/insights.html">Insights</a>
            </nav>
        </div>
        <div class="header-right" style="display:flex; align-items:center; gap: 1rem;">
            <a href="/auth/instagram" class="btn-connect" id="btn-connect">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                Conectar Instagram
            </a>
            <div class="status-badge" id="status-badge">
                <div class="pulse"></div>
                Escuchando a Instagram API
            </div>
        </div>
    </header>

    <main>
        <div class="logs-container" id="logs">
            <div class="empty-state" id="empty-state">
                <p>Esperando eventos de Instagram...</p>
                <p style="font-size: 0.875rem; margin-top: 0.5rem; opacity: 0.7;">Los DMs, comentarios y menciones aparecerán aquí en tiempo real.</p>
            </div>
        </div>
    </main>

    <script>
        const logsContainer = document.getElementById('logs');
        const emptyState = document.getElementById('empty-state');

        function createLogElement(log) {
            const el = document.createElement('div');
            el.className = 'log-card';
            
            const time = new Date(log.timestamp).toLocaleTimeString();
            let typeClass = 'type-system';
            if (log.type === 'DM') typeClass = 'type-dm';
            if (log.type === 'COMMENT') typeClass = 'type-comment';
            if (log.type === 'MENTION') typeClass = 'type-mention';
            if (log.type === 'STORY') typeClass = 'type-story';
            if (log.type === 'ERROR') typeClass = 'type-error';

            const logHeader = document.createElement('div');
            logHeader.className = 'log-header';
            
            const logType = document.createElement('span');
            logType.className = `log-type ${typeClass}`;
            logType.textContent = log.type;
            
            const logTime = document.createElement('span');
            logTime.textContent = time;
            
            logHeader.appendChild(logType);
            logHeader.appendChild(logTime);

            const logContent = document.createElement('div');
            logContent.className = 'log-content';

            if (log.profile && log.profile.profile_pic) {
                const avatar = document.createElement('img');
                avatar.src = log.profile.profile_pic;
                avatar.alt = 'Avatar';
                avatar.className = 'user-avatar';
                logContent.appendChild(avatar);
            }

            const logTextContainer = document.createElement('div');
            logTextContainer.className = 'log-text';
            logTextContainer.textContent = log.message;
            logContent.appendChild(logTextContainer);

            el.appendChild(logHeader);
            el.appendChild(logContent);
            return el;
        }

        // Connect to SSE stream
        const evtSourceToken = localStorage.getItem('API_SECRET') || '';
        const evtSource = new EventSource("/stream?token=" + encodeURIComponent(evtSourceToken));

        evtSource.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // Si es un mensaje de conexión pero ya tenemos logs, lo ignoramos para no hacer spam visual
            if (data.type === 'SYSTEM' && data.message.includes('Conectado') && logsContainer.children.length > 1) {
                return;
            }

            if (emptyState) {
                emptyState.style.display = 'none';
            }

            const logEl = createLogElement(data);
            logsContainer.prepend(logEl);

            // Keep max 50 logs in UI
            if (logsContainer.children.length > 50) {
                logsContainer.lastElementChild.remove();
            }
        };

        evtSource.onerror = (err) => {
            // El navegador reconectará automáticamente. 
            // Mantenemos el error solo en la consola para no asustar al usuario visualmente.
            console.warn("La conexión en vivo se interrumpió temporalmente (EventSource). Reconectando de forma silenciosa...");
        };

        // Setup SSE for Logs
        setupEventSource();

        // Verificamos el estado de autenticación OAuth
        fetch('/api/auth/status')
            .then(res => res.json())
            .then(data => {
                const btnConnect = document.getElementById('btn-connect');
                if (data.connected) {
                    btnConnect.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> Instagram Conectado';
                    btnConnect.classList.add('connected');
                }
            })
            .catch(console.error);

    </script>
</body>
</html>
