<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contactos - CRM 2.0</title>
  <link rel="stylesheet" href="contacts.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles/global.css">
</head>
<body>
  <div class="app-container">
    <div id="global-navbar"></div>

    <main class="contacts-layout">
      <!-- Left Sidebar: Contact List -->
      <section class="contacts-sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title-row">
            <h2>Contactos</h2>
            <span class="contact-count" id="contactCount">0</span>
          </div>
          <div class="search-bar">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="contactSearch" placeholder="Buscar por nombre, ID o tag...">
          </div>
          <div class="filter-row">
            <select id="filterStatus" class="filter-select">
              <option value="">Todos los estados</option>
              <option value="open">Abierto</option>
              <option value="closed">Cerrado</option>
              <option value="pending">Pendiente</option>
            </select>
            <select id="filterTag" class="filter-select">
              <option value="">Todos los tags</option>
            </select>
            <button class="btn-icon" id="btnSync" title="Sincronizar Meta">
              <i class="fa-solid fa-rotate"></i>
            </button>
            <button class="btn-icon" id="btnExport" title="Exportar CSV">
              <i class="fa-solid fa-download"></i>
            </button>
          </div>
        </div>
        <div class="contacts-list" id="contactsList">
          <div class="loading-contacts"><i class="fa-solid fa-spinner fa-spin"></i> Cargando...</div>
        </div>
      </section>

      <!-- Center: Chat Window -->
      <section class="chat-window">
        <div class="chat-header">
          <div class="chat-user-info" id="chatHeaderInfo">
            <h3>Selecciona un contacto</h3>
            <span class="status-indicator"></span>
          </div>
          <div class="chat-actions">
            <button class="btn-toggle-bot" id="btnToggleBot" disabled>
              <i class="fa-solid fa-robot"></i> <span id="botStatusText">Bot</span>
            </button>
          </div>
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="empty-chat-state">
            <i class="fa-regular fa-comments"></i>
            <p>Selecciona un contacto para ver el historial de mensajes</p>
          </div>
        </div>
        <div class="chat-input-area">
          <textarea id="messageInput" placeholder="Escribe un mensaje..." rows="1" disabled></textarea>
          <button class="btn-send" id="btnSendMessage" disabled title="Enviar por Instagram">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
          <button class="btn-send" id="btnInjectResume" disabled title="Inyectar a LangGraph y Reanudar IA" style="background-color: var(--secondary-color); margin-left: 8px;">
            <i class="fa-solid fa-brain"></i>
          </button>
        </div>
      </section>

      <!-- Right Sidebar: Contact Profile -->
      <section class="profile-sidebar" id="profileSidebar">
        <div class="profile-empty" id="profileEmpty">
          <i class="fa-regular fa-user"></i>
          <p>Sin contacto seleccionado</p>
        </div>
        <div class="profile-content hidden" id="profileContent">
          <div class="profile-avatar" id="profileAvatar">
            <i class="fa-solid fa-user-circle"></i>
          </div>
          <h2 id="profileName">Nombre</h2>
          <p class="profile-ig">@<span id="profileIgId">instagram_id</span></p>

          <div class="profile-section">
            <h3>Estado del Bot</h3>
            <div class="status-badge" id="profileBotStatus">Activo</div>
          </div>

          <div class="profile-section">
            <h3>Estado del Contacto</h3>
            <select class="profile-status-select" id="profileStatusSelect">
              <option value="open">Abierto</option>
              <option value="pending">Pendiente</option>
              <option value="closed">Cerrado</option>
            </select>
          </div>

          <div class="profile-section">
            <h3>Etiquetas</h3>
            <div class="tags-container" id="profileTags"></div>
            <div class="tag-add-row">
              <input type="text" id="newTagInput" placeholder="Nuevo tag..." class="tag-input">
              <button class="btn-icon-sm" id="btnAddTag"><i class="fa-solid fa-plus"></i></button>
            </div>
          </div>

          <div class="profile-section">
            <h3>Actividad</h3>
            <div class="profile-stats">
              <div class="stat-item">
                <span class="stat-value" id="profileMsgCount">0</span>
                <span class="stat-label">Mensajes</span>
              </div>
              <div class="stat-item">
                <span class="stat-value" id="profileCreatedAt">-</span>
                <span class="stat-label">Primer contacto</span>
              </div>
              <div class="stat-item">
                <span class="stat-value" id="profileLastActive">-</span>
                <span class="stat-label">Ultima actividad</span>
              </div>
            </div>
          </div>

          <div class="profile-section" id="profileFieldsSection">
            <h3>Datos Recopilados</h3>
            <div class="fields-list" id="profileFields"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="auth.js"></script>
  <script src="contacts.js"></script>
  <script src="/components/navbar.js"></script>
</body>
</html>
