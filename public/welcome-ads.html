<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Message Ads - Faroles Genius CRM</title>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles/global.css">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #8a2be2;
            --accent-hover: #9d4edd;
            --text-main: #f8f9fa;
            --text-muted: #adb5bd;
            --success: #20c997;
            --warning: #ffc107;
            --danger: #fa5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 17, 21, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent);
        }

        .nav-bar {
            display: flex;
            gap: 0.5rem;
        }

        .nav-bar a {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.15s;
        }

        .nav-bar a:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .nav-bar a.active {
            background: rgba(138, 43, 226, 0.15);
            color: #b175ff;
        }

        .page-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #fff, #adb5bd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.875rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(138, 43, 226, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.875rem;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 4px;
            transition: all 0.15s;
            font-size: 1rem;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .btn-danger {
            background: rgba(250, 82, 82, 0.15);
            color: var(--danger);
            border: 1px solid rgba(250, 82, 82, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.875rem;
        }

        .btn-danger:hover {
            background: rgba(250, 82, 82, 0.25);
        }

        .flows-table-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.875rem;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .flow-name {
            font-weight: 600;
            color: #b175ff;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.15s;
        }

        .flow-name:hover {
            color: #c48fff;
        }

        .flow-id {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-live {
            background: rgba(32, 201, 151, 0.15);
            color: var(--success);
        }

        .status-stopped {
            background: rgba(250, 82, 82, 0.15);
            color: var(--danger);
        }

        .status-draft {
            background: rgba(255, 193, 7, 0.15);
            color: var(--warning);
        }

        .keywords-cell {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        .keyword-pill {
            background: rgba(138, 43, 226, 0.2);
            color: #b175ff;
            padding: 0.25rem 0.625rem;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 500;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .keyword-more {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .actions-cell {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .toggle-switch {
            position: relative;
            display: inline-flex;
            width: 40px;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            align-items: center;
        }

        .toggle-switch input {
            display: none;
        }

        .toggle-slider {
            position: absolute;
            width: 18px;
            height: 18px;
            background: var(--text-muted);
            border-radius: 50%;
            left: 3px;
            transition: all 0.15s;
        }

        .toggle-switch input:checked + .toggle-slider {
            background: var(--success);
            left: 19px;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(8px);
        }

        .modal h3 {
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .modal p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .date-cell {
            color: var(--text-muted);
        }

        .step-count {
            background: rgba(138, 43, 226, 0.15);
            color: #b175ff;
            padding: 0.25rem 0.625rem;
            border-radius: 3px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="global-navbar"></div>

    <div class="crm-main-container">
        <div class="crm-page-header">
            <h1 class="crm-page-title">🎯 Welcome Message Ads <span class="flow-count" id="flow-count"></span></h1>
            <button class="crm-btn-primary" onclick="openCreateModal()">+ Nuevo Welcome Flow</button>
        </div>

        <div class="crm-table-container">
            <table class="crm-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th>Mensaje</th>
                        <th>Botones</th>
                        <th>Ads Manager</th>
                        <th>Creado</th>
                        <th style="text-align:right">Acciones</th>
                    </tr>
                </thead>
                <tbody id="flows-body">
                </tbody>
            </table>
            <div class="empty-state" id="empty-state">
                <div class="icon">📢</div>
                <h3>No hay Welcome Flows</h3>
                <p>Crea tu primer flujo de bienvenida para anuncios de Instagram</p>
            </div>
        </div>
    </div>

    <!-- Modal para crear/editar -->
    <div class="modal-overlay" id="create-modal">
        <div class="modal">
            <h3 id="modal-title">Nuevo Welcome Flow</h3>
            <form id="flow-form">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Nombre</label>
                    <input type="text" id="flow-name" placeholder="Ej: Catálogo de Productos" style="width: 100%; padding: 0.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main);">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Mensaje de Bienvenida</label>
                    <textarea id="flow-message" placeholder="El mensaje que recibirá el usuario al hacer click..." style="width: 100%; padding: 0.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); min-height: 80px; resize: vertical;"></textarea>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Botones de Respuesta Rápida</label>
                    <div id="quick-replies" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem;"></div>
                    <button type="button" onclick="addQuickReply()" style="background: rgba(138,43,226,0.2); color: #b175ff; border: 1px solid rgba(138,43,226,0.3); padding: 0.5rem; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600;">+ Agregar Botón</button>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" onclick="closeCreateModal()" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para eliminar -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal">
            <h3>Eliminar Welcome Flow</h3>
            <p>¿Estás seguro de que quieres eliminar <strong id="delete-flow-name"></strong>? Esta acción no se puede deshacer.</p>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeDeleteModal()">Cancelar</button>
                <button class="btn-danger" id="btn-confirm-delete">Eliminar</button>
            </div>
        </div>
    </div>

    <script>
        let allFlows = [];
        let currentEditingId = null;
        let deleteTarget = null;

        function getAuthHeader() {
            const token = localStorage.getItem('API_SECRET');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }

        async function loadFlows() {
            try {
                const res = await fetch('/api/welcome-flows', {
                    headers: getAuthHeader()
                });
                allFlows = await res.json();
                renderFlows();
            } catch (err) {
                console.error('Error loading flows:', err);
            }
        }

        function renderFlows() {
            const tbody = document.getElementById('flows-body');
            const empty = document.getElementById('empty-state');
            const count = document.getElementById('flow-count');

            count.textContent = `(${allFlows.length})`;

            if (allFlows.length === 0) {
                tbody.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            tbody.innerHTML = allFlows.map(flow => `
                <tr>
                    <td>
                        <div class="flow-name" onclick="editFlow('${flow.id}')">${escapeHtml(flow.name)}</div>
                        <div class="flow-id">${escapeHtml(flow.id)}</div>
                    </td>
                    <td>
                        <span class="${flow.is_used_in_ad ? 'crm-badge-active' : 'crm-badge-draft'}">
                            ${flow.is_used_in_ad ? 'EN USO' : 'BORRADOR'}
                        </span>
                    </td>
                    <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(flow.message_text)}</td>
                    <td>${flow.quick_replies?.length || 0} botones</td>
                    <td>${flow.is_used_in_ad ? '✅ Conectado' : '❌ Libre'}</td>
                    <td style="color: var(--text-muted); font-size: 0.8rem;">${new Date(flow.created_at).toLocaleDateString()}</td>
                    <td style="text-align: right;">
                        ${flow.is_used_in_ad ? 
                          '<span style="font-size:0.75rem; color:var(--text-muted); margin-right:1rem;">Bloqueado por Meta</span>' : 
                          `<button class="btn-icon" title="Editar" onclick="editFlow('${flow.id}')">✏️</button>
                           <button class="btn-icon" title="Eliminar" onclick="openDeleteModal('${flow.id}', '${escapeHtml(flow.name)}')">🗑️</button>`
                        }
                    </td>
                </tr>
            `).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function openCreateModal() {
            currentEditingId = null;
            document.getElementById('modal-title').textContent = 'Nuevo Welcome Flow';
            document.getElementById('flow-name').value = '';
            document.getElementById('flow-message').value = '';
            document.getElementById('quick-replies').innerHTML = '';
            addQuickReply();
            document.getElementById('create-modal').classList.add('visible');
        }

        function closeCreateModal() {
            document.getElementById('create-modal').classList.remove('visible');
        }

        function addQuickReply() {
            const container = document.getElementById('quick-replies');
            const id = 'qr_' + Math.random();
            const el = document.createElement('div');
            el.id = id;
            el.style.cssText = 'display: flex; gap: 0.5rem; align-items: flex-end;';
            el.innerHTML = `
                <input type="text" class="qr-title" placeholder="Título (ej: Ver Catálogo)" style="flex: 1; padding: 0.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main);">
                <input type="text" class="qr-payload" placeholder="Payload (ej: BTN_CATALOG)" style="flex: 1; padding: 0.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main);">
                <button type="button" onclick="document.getElementById('${id}').remove()" style="background: rgba(250,82,82,0.2); color: var(--danger); border: 1px solid rgba(250,82,82,0.3); padding: 0.5rem; border-radius: 6px; cursor: pointer;">−</button>
            `;
            container.appendChild(el);
        }

        async function editFlow(id) {
            const flow = allFlows.find(f => f.id === id);
            if (!flow) return;

            currentEditingId = id;
            document.getElementById('modal-title').textContent = 'Editar ' + flow.name;
            document.getElementById('flow-name').value = flow.name;
            document.getElementById('flow-message').value = flow.message_text;

            const qrContainer = document.getElementById('quick-replies');
            qrContainer.innerHTML = '';
            for (const qr of (flow.quick_replies || [])) {
                const el = document.createElement('div');
                el.style.cssText = 'display: flex; gap: 0.5rem; align-items: flex-end;';
                const id = 'qr_' + Math.random();
                el.id = id;
                el.innerHTML = `
                    <input type="text" class="qr-title" value="${escapeHtml(qr.title)}" placeholder="Título" style="flex: 1; padding: 0.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main);">
                    <input type="text" class="qr-payload" value="${escapeHtml(qr.payload)}" placeholder="Payload" style="flex: 1; padding: 0.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main);">
                    <button type="button" onclick="document.getElementById('${id}').remove()" style="background: rgba(250,82,82,0.2); color: var(--danger); border: 1px solid rgba(250,82,82,0.3); padding: 0.5rem; border-radius: 6px; cursor: pointer;">−</button>
                `;
                qrContainer.appendChild(el);
            }

            document.getElementById('create-modal').classList.add('visible');
        }

        document.getElementById('flow-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('flow-name').value.trim();
            const message_text = document.getElementById('flow-message').value.trim();

            if (!name || !message_text) {
                alert('Por favor rellena todos los campos');
                return;
            }

            const quick_replies = [];
            for (const el of document.querySelectorAll('#quick-replies > div')) {
                const title = el.querySelector('.qr-title').value.trim();
                const payload = el.querySelector('.qr-payload').value.trim();
                if (title && payload) {
                    quick_replies.push({ title, payload });
                }
            }

            const url = currentEditingId ? `/api/welcome-flows/${currentEditingId}` : '/api/welcome-flows';
            const method = currentEditingId ? 'PATCH' : 'POST';

            try {
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json', ...getAuthHeader() },
                    body: JSON.stringify({ name, message_text, quick_replies })
                });
                if (res.ok) {
                    closeCreateModal();
                    loadFlows();
                } else {
                    alert('Error: ' + (await res.text()));
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        function openDeleteModal(id, name) {
            deleteTarget = id;
            document.getElementById('delete-flow-name').textContent = name;
            document.getElementById('delete-modal').classList.add('visible');
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.remove('visible');
        }

        document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
            if (!deleteTarget) return;
            try {
                const res = await fetch(`/api/welcome-flows/${deleteTarget}`, {
                    method: 'DELETE',
                    headers: getAuthHeader()
                });
                if (res.ok) {
                    closeDeleteModal();
                    loadFlows();
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        loadFlows();
    </script>
    <script src="/components/navbar.js"></script>
</body>
</html>
